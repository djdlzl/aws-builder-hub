server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy code-server (VS Code in browser)
    # ^~ 수식자: regex location보다 우선 적용 (.js/.css 캐시 규칙에 가로채이지 않음)
    location ^~ /code-server/ {
        proxy_pass http://code-server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # iframe 임베딩 허용
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Proxy Locust UI by path (e.g. /locust/8090/)
    # backend가 할당한 포트를 path로 받아 host의 Locust 포트로 프록시
    location ~ ^/locust/([0-9]+)$ {
        return 302 /locust/$1/;
    }

    location ~ ^/locust/([0-9]+)(/.*)$ {
        proxy_pass http://172.17.0.1:$1$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }

    # Proxy WebSocket traffic to backend (SSM, etc.)
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # index.html - 절대 캐시하지 않음 (새 배포 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 빌드 에셋: 파일명이 해시되므로 1년 immutable 캐시 안전
    # (예: /assets/index-BjqSMqxN.js - 코드 변경 시 파일명 자체가 바뀜)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # public/ 정적 파일: 파일명이 고정이므로 immutable 사용 불가, 짧은 캐시
    # (favicon.ico, favicon.svg, placeholder.svg 등)
    location ~* \.(ico|svg|png|jpg|jpeg|gif|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
