<!DOCTYPE html>
<html>
<head>
    <title>Network Topology API 확인</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Network Topology API 응답 확인</h1>
    <button onclick="checkAPI()">API 응답 확인</button>
    <div id="result"></div>

    <script>
        async function checkAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>로딩 중...</p>';

            try {
                const response = await fetch('/api/network-topology', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                    }
                });

                const data = await response.json();

                // 첫 번째 VPC와 Subnet 찾기
                const firstAccount = Object.values(data.hierarchy.accounts)[0];
                const firstRegion = Object.values(firstAccount.regions)[0];
                const firstVpc = Object.values(firstRegion.vpcs)[0];
                const firstSubnet = Object.values(firstVpc.subnets)[0];

                const output = {
                    'VPC 데이터': {
                        vpcId: firstVpc.vpcId,
                        cidrBlock: firstVpc.cidrBlock,
                        tags: firstVpc.tags,
                        name: firstVpc.name,
                        '태그 타입': typeof firstVpc.tags,
                        '태그 값': firstVpc.tags
                    },
                    'Subnet 데이터': {
                        subnetId: firstSubnet.subnetId,
                        cidrBlock: firstSubnet.cidrBlock,
                        tags: firstSubnet.tags,
                        name: firstSubnet.name,
                        routeTableId: firstSubnet.routeTableId,
                        routes: firstSubnet.routes,
                        '태그 타입': typeof firstSubnet.tags,
                        'routes 타입': typeof firstSubnet.routes
                    }
                };

                resultDiv.innerHTML = '<h2>API 응답:</h2><pre>' +
                    JSON.stringify(output, null, 2) + '</pre>';

            } catch (error) {
                resultDiv.innerHTML = '<p style="color: red;">에러: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
